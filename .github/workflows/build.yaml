
name: Build Files - Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and package Files
        shell: pwsh
        run: |
          msbuild Files.slnx `
            -restore `
            -t:Build `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageDir="${{ github.workspace }}\Artifacts\\" `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=Sideload `
            -v:quiet

      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Files-Windows-x64
          path: |
            Artifacts/**/*.msix
            Artifacts/**/*.cer
          if-no-files-found: warn
          retention-days: 14
