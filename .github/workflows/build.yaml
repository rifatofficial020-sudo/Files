
name: Build Files EXE Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 Installer
    runs-on: windows-latest

    env:
      DOTNET_ROOT: C:\Program Files\dotnet
      BUILD_CONFIGURATION: Release

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install build tools
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3. Clean previous build files
      - name: Clean previous build files
        shell: pwsh
        run: |
          Get-ChildItem -Path src -Directory -Recurse -Force |
            Where-Object { $_.Name -in @("bin", "obj") } |
            ForEach-Object {
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }

          Remove-Item "Artifacts" -Recurse -Force -ErrorAction SilentlyContinue

      # 4. Create or import signing certificate
      - name: Prepare signing certificate
        shell: pwsh
        env:
          FILES_SIGNING_PFX_BASE64: ${{ secrets.FILES_SIGNING_PFX_BASE64 }}
          FILES_SIGNING_PFX_PASSWORD: ${{ secrets.FILES_SIGNING_PFX_PASSWORD }}
        run: |
          $certDirectory = Join-Path $env:RUNNER_TEMP "FilesCertificate"
          New-Item -ItemType Directory -Path $certDirectory -Force | Out-Null

          $pfxPath = Join-Path $certDirectory "FilesSigning.pfx"
          $cerPath = Join-Path $certDirectory "FilesSigning.cer"

          if ($env:FILES_SIGNING_PFX_BASE64) {
            Write-Host "Importing configured signing certificate..."

            $bytes = [Convert]::FromBase64String($env:FILES_SIGNING_PFX_BASE64)
            [IO.File]::WriteAllBytes($pfxPath, $bytes)

            $password = ConvertTo-SecureString `
              $env:FILES_SIGNING_PFX_PASSWORD `
              -AsPlainText -Force

            $certificate = Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password

            if (-not $certificate) {
              throw "Could not import signing certificate"
            }

            Export-Certificate `
              -Cert $certificate `
              -FilePath $cerPath | Out-Null

          } else {
            Write-Host "Creating a temporary signing certificate..."

            $certificate = New-SelfSignedCertificate `
              -Subject "CN=Files" `
              -Type CodeSigningCert `
              -CertStoreLocation Cert:\CurrentUser\My `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -KeyExportPolicy Exportable `
              -NotAfter (Get-Date).AddYears(2)

            $password = ConvertTo-SecureString `
              "Temporary-Files-Certificate-2026!" `
              -AsPlainText -Force

            Export-PfxCertificate `
              -Cert $certificate `
              -FilePath $pfxPath `
              -Password $password | Out-Null

            Export-Certificate `
              -Cert $certificate `
              -FilePath $cerPath | Out-Null
          }

          "PFX_PATH=$pfxPath" | Out-File $env:GITHUB_ENV -Append
          "CER_PATH=$cerPath" | Out-File $env:GITHUB_ENV -Append

      # 5. Restore server project for Windows x64
      - name: Restore Files.App.Server
        shell: pwsh
        run: |
          Write-Host "Restoring Files.App.Server for Windows x64..."

          dotnet restore src/Files.App.Server/Files.App.Server.csproj `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64

          if ($LASTEXITCODE -ne 0) {
            throw "Files.App.Server NuGet restore failed"
          }

      # 6. Restore main app for Windows x64
      - name: Restore Files.App
        shell: pwsh
        run: |
          Write-Host "Restoring Files.App for Windows x64..."

          dotnet restore src/Files.App/Files.App.csproj `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64

          if ($LASTEXITCODE -ne 0) {
            throw "Files.App NuGet restore failed"
          }

      # 7. Build MSIX bundle
      - name: Build Files MSIX bundle
        shell: pwsh
        run: |
          Write-Host "Building Files for Windows x64..."

          msbuild src/Files.App/Files.App.csproj `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:AppxPackage=true `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=Sideload `
            /p:AppxIntermediateExtension=.intermediate `
            /p:PackageCertificateKeyFile="$env:PFX_PATH" `
            /p:PackageCertificatePassword="Temporary-Files-Certificate-2026!"

          if ($LASTEXITCODE -ne 0) {
            throw "Files MSIX build failed"
          }

      # 8. Stage bundle and dependencies
      - name: Prepare installer files
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "Artifacts"
          $packageDirectory = Join-Path $output "Package"

          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null

          Write-Host "Searching for generated MSIX bundle..."

          $bundle = Get-ChildItem -Path src -Recurse -File |
            Where-Object {
              $_.Extension -in @(".msixbundle", ".appxbundle")
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $bundle) {
            throw "No MSIX or APPX bundle was generated"
          }

          Write-Host "Found bundle: $($bundle.FullName)"

          Copy-Item $bundle.FullName $packageDirectory

          Write-Host "Searching for x64 dependencies..."

          $dependencyDirectories = Get-ChildItem -Path src -Directory -Recurse |
            Where-Object { $_.Name -eq "Dependencies" }

          foreach ($directory in $dependencyDirectories) {
            $x64Directory = Join-Path $directory.FullName "x64"

            if (Test-Path $x64Directory) {
              Copy-Item `
                (Join-Path $x64Directory "*") `
                $packageDirectory `
                -Recurse -Force
            }
          }

          Copy-Item $env:CER_PATH $packageDirectory

          Write-Host "Writing installation script..."

          @'
          $ErrorActionPreference = "Stop"

          $packageDirectory = Join-Path $PSScriptRoot "Package"

          $bundle = Get-ChildItem -Path $packageDirectory -File |
            Where-Object {
              $_.Extension -in @(".msixbundle", ".appxbundle")
            } |
            Select-Object -First 1

          if (-not $bundle) {
            throw "Application package was not found."
          }

          $certificate = Get-ChildItem -Path $packageDirectory -Filter "*.cer" |
            Select-Object -First 1

          if ($certificate) {
            Write-Host "Installing application certificate..."

            Import-Certificate `
              -FilePath $certificate.FullName `
              -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null

            Import-Certificate `
              -FilePath $certificate.FullName `
              -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          }

          $dependencies = @(
            Get-ChildItem -Path $packageDirectory -Filter "*.appx" -File |
              Select-Object -ExpandProperty FullName

            Get-ChildItem -Path $packageDirectory -Filter "*.msix" -File |
              Select-Object -ExpandProperty FullName
          )

          Write-Host "Installing Files..."

          if ($dependencies.Count -gt 0) {
            Add-AppxPackage `
              -Path $bundle.FullName `
              -DependencyPath $dependencies `
              -ForceApplicationShutdown
          } else {
            Add-AppxPackage `
              -Path $bundle.FullName `
              -ForceApplicationShutdown
          }

          Write-Host "Files installed successfully."
          '@ | Set-Content `
            -Path (Join-Path $output "Install-Files.ps1") `
            -Encoding UTF8

          Write-Host "Installer files staged successfully."

      # 9. Install Inno Setup
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed"
          }

      # 10. Create Inno Setup installer configuration
      - name: Create installer configuration
        shell: pwsh
        run: |
          $issPath = Join-Path $env:GITHUB_WORKSPACE "FilesInstaller.iss"

          @'
          #define AppName "Files"
          #define AppVersion "1.0.0"
          #define SourceDir "Artifacts"

          [Setup]
          AppId={{D7A43C18-98A4-4F70-A912-765432109876}
          AppName={#AppName}
          AppVersion={#AppVersion}
          AppPublisher=Files
          DefaultDirName={localappdata}\FilesInstaller
          DefaultGroupName=Files
          OutputDir=Artifacts
          OutputBaseFilename=Files-Setup-x64
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=lowest
          Uninstallable=no

          [Files]
          Source: "{#SourceDir}\Package\*"; DestDir: "{app}\Package"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "{#SourceDir}\Install-Files.ps1"; DestDir: "{app}"; Flags: ignoreversion

          [Run]
          Filename: "powershell.exe"; Parameters: "-NoProfile -ExecutionPolicy Bypass -File ""{app}\Install-Files.ps1"""; Flags: waituntilterminated; StatusMsg: "Installing Files..."
          '@ | Set-Content -Path $issPath -Encoding UTF8

          Write-Host "Inno Setup configuration created."

      # 11. Compile final EXE
      - name: Build EXE installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $compiler)) {
            $compiler = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found"
          }

          & $compiler FilesInstaller.iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed"
          }

          $exe = Join-Path $env:GITHUB_WORKSPACE "Artifacts\Files-Setup-x64.exe"

          if (-not (Test-Path $exe)) {
            throw "Installer EXE was not created"
          }

          Write-Host "Installer successfully created: $exe"

      # 12. Upload installer
      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: Files-Windows-x64-Installer
          path: Artifacts/Files-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
